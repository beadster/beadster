name: Beadster
options:
  bundleIdPrefix: ai.beadster
  deploymentTarget:
    macOS: "27.0"
  xcodeVersion: "27.0"
  developmentLanguage: en

packages:
  FSEventsWatcher:
    path: ../../common/swift-packages/FSEventsWatcher
  BookmarkManager:
    path: ../../common/swift-packages/BookmarkManager
  BeadsKit:
    path: ../Packages/BeadsKit
  AppCatalog:
    path: ../../common/swift-packages/AppCatalog

settings:
  base:
    DEVELOPMENT_TEAM: 6TW2DVT32T
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_CXX_LANGUAGE_STANDARD: gnu++20
    GCC_C_LANGUAGE_STANDARD: gnu17

targets:
  Beadster:
    type: application
    platform: macOS
    sources:
      - path: Beadster
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: FSEventsWatcher
      - package: BookmarkManager
      - package: BeadsKit
      - package: AppCatalog
      # beads 1.3.1 in-process; build it with: bash BeadsFFI/build.sh archive
      - framework: BeadsFFI/build/BeadsFFI.xcframework
        embed: false
    scheme:
      testTargets:
        - BeadsterTests
    # common/lib/a11y: a new unnamed icon button, ungated animation or silent tap target fails
    # the build (the ratchet in AppStore/accessibility.json only goes down)
    preBuildScripts:
      - name: accessibility gate
        script: python3 "$SRCROOT/../../common/lib/a11y/check-a11y.py" "$SRCROOT/AppStore/accessibility.json"
        basedOnDependencyAnalysis: false
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: ai.beadster.mac
        CURRENT_PROJECT_VERSION: 16
        MARKETING_VERSION: "2.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Beadster/Beadster.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES
        REGISTER_APP_GROUPS: YES
        SDKROOT: auto
        SUPPORTED_PLATFORMS: macosx
        SUPPORTS_MACCATALYST: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Beadster: Issue Tracking"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          SWIFT_OPTIMIZATION_LEVEL: -Onone
          DEBUG_INFORMATION_FORMAT: dwarf
          MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          ENABLE_NS_ASSERTIONS: NO

  # the app's own logic; hosted in the app, so running it launches beadster ([L], Q5)
  BeadsterTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: BeadsterTests
    dependencies:
      # BeadsKit and AppCatalog come with the host app: linking them here as well links them
      # twice and leaves AppCatalog's EditorKit symbols unresolved in the host
      - target: Beadster
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.beadster.mac.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic

  # P4: the sandbox proof. Same entitlements, its own bundle id and container. Launching it is
  # anton's [L] step (one click in the open panel); building it is part of the gates.
  SandboxProbe:
    type: application
    platform: macOS
    sources:
      - path: SandboxProbe
        excludes:
          - "*.entitlements"
      - path: Beadster/Engine
    dependencies:
      - framework: BeadsFFI/build/BeadsFFI.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.beadster.sandboxprobe
        PRODUCT_NAME: Beadster Sandbox Probe
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: SandboxProbe/SandboxProbe.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
