name: Beadster
options:
  bundleIdPrefix: ai.beadster
  deploymentTarget:
    macOS: "27.0"
  xcodeVersion: "27.0"
  developmentLanguage: en

packages:
  FSEventsWatcher:
    path: ../../common/swift-packages/FSEventsWatcher

settings:
  base:
    DEVELOPMENT_TEAM: 6TW2DVT32T
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_CXX_LANGUAGE_STANDARD: gnu++20
    GCC_C_LANGUAGE_STANDARD: gnu17

targets:
  Beadster:
    type: application
    platform: macOS
    sources:
      - path: Beadster
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: FSEventsWatcher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.beadster.mac
        CURRENT_PROJECT_VERSION: 16
        MARKETING_VERSION: "2.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Beadster/Beadster.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES
        REGISTER_APP_GROUPS: YES
        SDKROOT: auto
        SUPPORTED_PLATFORMS: macosx
        SUPPORTS_MACCATALYST: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Beadster: Issue Tracking"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          SWIFT_OPTIMIZATION_LEVEL: -Onone
          DEBUG_INFORMATION_FORMAT: dwarf
          MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          ENABLE_NS_ASSERTIONS: NO
